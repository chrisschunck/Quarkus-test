quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:quarkus}
quarkus.datasource.password=${DB_PASSWORD:quarkus}
mp.messaging.connector.smallrye-rabbitmq.host=${RABBITMQ_HOST:localhost}
mp.messaging.connector.smallrye-rabbitmq.port=${RABBITMQ_PORT:5672}
mp.messaging.connector.smallrye-rabbitmq.username=${RABBITMQ_USERNAME:guest}
mp.messaging.connector.smallrye-rabbitmq.password=${RABBITMQ_PASSWORD:guest}

%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/produtos}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://postgres:5432/produtos}
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update

quarkus.http.host=0.0.0.0
quarkus.container-image.build=false
quarkus.container-image.group=quarkus
quarkus.container-image.name=quarkus-test
